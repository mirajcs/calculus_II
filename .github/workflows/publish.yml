name: Publish Quarto site

on:
  push:
    branches: main
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write         # needed to deploy to GitHub Pages
  id-token: write      # needed by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
          tinytex: true   # LaTeX for the PDF outputs

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PYTHON: .venv/bin/python

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy directly from the workflow: pushes to gh-pages made with GITHUB_TOKEN
  # don't trigger GitHub's own "pages build and deployment" workflow.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
